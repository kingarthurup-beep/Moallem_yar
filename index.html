<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>معلم‌یار — دستیار هوشمند معلم</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1E2A38" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Vazirmatn', sans-serif; }
  ::-webkit-scrollbar { width: 8px; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const COLORS = {
  ink: "#1E2A38", inkSoft: "#4B5A6B", paper: "#F3F1EA", paperDeep: "#EAE6DB",
  saffron: "#B8722A", saffronSoft: "#E8C596", sage: "#4B7B5B", sageSoft: "#CFE0D3",
  brick: "#A9414D", brickSoft: "#F0D3D6", line: "#D8D2C4",
};

async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  const text = (data.content || []).map(b => b.type === "text" ? b.text : "").filter(Boolean).join("\n");
  return text || "پاسخی دریافت نشد.";
}

const initialGroups = [
  { id: 1, name: "پایه هفتم – ریاضی", members: 24, messages: [
    { id: 101, role: "parent", sender: "مادر آرمین", text: "سلام خانم معلم، امتحان فصل سوم چه روزیه؟ آرمین یادش رفته یادداشت کنه.", time: "۰۸:۱۲" },
    { id: 102, role: "student", sender: "سارا رضایی", text: "ببخشید تمرین صفحه ۴۵ رو باید کامل حل کنیم یا فقط سوال‌های زوج؟", time: "۰۹:۰۵" },
    { id: 103, role: "parent", sender: "پدر نیکا", text: "نیکا امروز به خاطر سرماخوردگی نمیاد مدرسه، تکالیفش رو کی میتونه بگیره؟", time: "۱۰:۴۰" },
  ]},
  { id: 2, name: "پایه هشتم – علوم", members: 19, messages: [
    { id: 201, role: "student", sender: "محمد کریمی", text: "خانم فیلم مربوط به فصل دستگاه گوارش رو نمیتونم پیدا کنم، لینکش رو دوباره میفرستید؟", time: "۱۱:۲۰" },
    { id: 202, role: "parent", sender: "مادر هستی", text: "گزارش کار آزمایشگاهی هفته پیش هنوز تصحیح نشده، هستی نگران نمرشه.", time: "۱۲:۰۰" },
  ]},
];

const initialAssignments = [
  { id: 1, title: "تمرین فصل سوم – کسرها", group: "پایه هفتم – ریاضی", due: "سه‌شنبه ۱۸ شهریور", remind: true },
  { id: 2, title: "گزارش آزمایش دستگاه گوارش", group: "پایه هشتم – علوم", due: "پنج‌شنبه ۲۰ شهریور", remind: true },
  { id: 3, title: "امتحان میان‌ترم فصل سوم", group: "پایه هفتم – ریاضی", due: "شنبه ۲۲ شهریور", remind: false },
];

const alerts = [
  { id: 1, student: "امیرحسین طالبی", group: "پایه هفتم – ریاضی", note: "سه تکلیف پشت‌سرهم تحویل نداده و در گروه هم غایب بوده." },
  { id: 2, student: "هستی نادری", group: "پایه هشتم – علوم", note: "نمره آزمون اخیر نسبت به میانگین قبلی افت محسوسی داشته." },
];

function TabButton({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} className="flex items-center gap-3 w-full py-3 px-4"
      style={{ color: active ? COLORS.ink : COLORS.inkSoft, background: active ? COLORS.paperDeep : "transparent",
        borderRight: active ? `3px solid ${COLORS.saffron}` : "3px solid transparent", border0: 0, display:"flex", alignItems:"center", gap:"12px", width:"100%", textAlign:"start", cursor:"pointer", background:"transparent" }}>
      <span style={{fontSize:"18px"}}>{icon}</span>
      <span style={{ fontWeight: active ? 600 : 500 }}>{label}</span>
    </button>
  );
}

function SectionTitle({ children, sub }) {
  return (
    <div style={{marginBottom:"24px"}}>
      <h2 style={{ fontSize: "22px", fontWeight: 700, color: COLORS.ink, margin:0 }}>{children}</h2>
      {sub && <p style={{ color: COLORS.inkSoft, fontSize: "14px", marginTop: "4px" }}>{sub}</p>}
    </div>
  );
}

function Panel({ children, style }) {
  return <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}`, padding: "20px", ...style }}>{children}</div>;
}

function AIButton({ onClick, loading, label = "پیشنهاد با هوش مصنوعی" }) {
  return (
    <button onClick={onClick} disabled={loading}
      style={{ display:"inline-flex", alignItems:"center", gap:"8px", padding:"8px 16px", fontSize:"14px",
        background: loading ? COLORS.saffronSoft : COLORS.saffron, color: "#fff", fontWeight: 600, border:"none", cursor:"pointer", opacity: loading ? 0.8 : 1 }}>
      <span>{loading ? "⏳" : "✨"}</span>
      {loading ? "در حال فکر کردن..." : label}
    </button>
  );
}

function TeacherAIApp() {
  const [activeTab, setActiveTab] = useState("dashboard");
  const [groups, setGroups] = useState(initialGroups);
  const [assignments, setAssignments] = useState(initialAssignments);
  const [selectedGroupId, setSelectedGroupId] = useState(1);
  const [replySuggestions, setReplySuggestions] = useState({});
  const [replyLoadingId, setReplyLoadingId] = useState(null);
  const [quizTopic, setQuizTopic] = useState("تناسب و درصد");
  const [quizCount, setQuizCount] = useState(4);
  const [quizLoading, setQuizLoading] = useState(false);
  const [quizResult, setQuizResult] = useState("");
  const [reportLoading, setReportLoading] = useState(false);
  const [reportResult, setReportResult] = useState("");
  const [parentStudent, setParentStudent] = useState("آرمین محمدی");
  const [parentNotes, setParentNotes] = useState("نمره ریاضی: ۱۸ از ۲۰. سه تکلیف کامل. یک بار غیبت بدون اطلاع.");
  const [parentLoading, setParentLoading] = useState(false);
  const [parentResult, setParentResult] = useState("");

  const selectedGroup = groups.find(g => g.id === selectedGroupId);

  async function handleSuggestReply(message) {
    setReplyLoadingId(message.id);
    try {
      const prompt = `تو دستیار یک معلم ایرانی در گروه کلاسی هستی. این پیام از یک ${message.role === "parent" ? "والد" : "دانش‌آموز"} به نام ${message.sender} است: "${message.text}"\nیک پاسخ کوتاه، مودبانه، دقیق و به زبان فارسی محاوره‌ای رسمی برای معلم بنویس که مستقیم قابل ارسال در گروه باشد. فقط متن پاسخ را بنویس.`;
      const text = await callClaude(prompt);
      setReplySuggestions(prev => ({ ...prev, [message.id]: text.trim() }));
    } catch (e) {
      setReplySuggestions(prev => ({ ...prev, [message.id]: "خطا در دریافت پاسخ. دوباره تلاش کنید." }));
    }
    setReplyLoadingId(null);
  }

  function handleSendReply(message) {
    const draft = replySuggestions[message.id];
    if (!draft) return;
    setGroups(prev => prev.map(g => g.id === selectedGroupId ? {
      ...g, messages: [...g.messages, { id: Date.now(), role: "teacher", sender: "شما", text: draft, time: "اکنون" }]
    } : g));
    setReplySuggestions(prev => { const n = { ...prev }; delete n[message.id]; return n; });
  }

  async function handleGenerateQuiz() {
    setQuizLoading(true); setQuizResult("");
    try {
      const prompt = `به عنوان یک معلم ایرانی، ${quizCount} سوال آزمون کوتاه درباره‌ی "${quizTopic}" برای دانش‌آموزان پایه هفتم/هشتم به زبان فارسی بساز. سوالات را شماره‌گذاری کن و در انتها پاسخ‌نامه را جدا بیاور.`;
      setQuizResult(await callClaude(prompt));
    } catch (e) { setQuizResult("خطا در ساخت آزمون."); }
    setQuizLoading(false);
  }

  async function handleGenerateReport() {
    setReportLoading(true); setReportResult("");
    try {
      const allMessages = groups.map(g => `گروه ${g.name}:\n` + g.messages.map(m => `- ${m.sender}: ${m.text}`).join("\n")).join("\n\n");
      const prompt = `این پیام‌های هفته اخیر گروه‌های کلاسی یک معلم است:\n\n${allMessages}\n\nیک خلاصه هفتگی کوتاه (حداکثر ۶ خط) برای خود معلم بنویس: مهم‌ترین سوالات تکراری، مسائل نیازمند پیگیری، و یک پیشنهاد عملی برای هفته بعد.`;
      setReportResult(await callClaude(prompt));
    } catch (e) { setReportResult("خطا در ساخت گزارش."); }
    setReportLoading(false);
  }

  async function handleGenerateParentReport() {
    setParentLoading(true); setParentResult("");
    try {
      const prompt = `یک گزارش هفتگی کوتاه و دلگرم‌کننده برای والدین دانش‌آموزی به نام ${parentStudent} بنویس. یادداشت معلم: "${parentNotes}"\nحداکثر ۴ خط، مودبانه و مشخص باشد.`;
      setParentResult(await callClaude(prompt));
    } catch (e) { setParentResult("خطا در ساخت گزارش."); }
    setParentLoading(false);
  }

  return (
    <div style={{ fontFamily: "'Vazirmatn', sans-serif", background: COLORS.paper, minHeight: "100vh" }}>
      <div style={{display:"flex", minHeight:"100vh"}}>
        <div style={{ width: "220px", borderLeft: `1px solid ${COLORS.line}`, background: "#fff", flexShrink:0 }}>
          <div style={{ padding: "20px 16px", borderBottom: `1px solid ${COLORS.line}` }}>
            <div style={{display:"flex", alignItems:"center", gap:"8px"}}>
              <span style={{fontSize:"22px"}}>🤖</span>
              <span style={{ fontWeight: 800, fontSize: "18px", color: COLORS.ink }}>معلم‌یار</span>
            </div>
            <p style={{ fontSize: "12px", color: COLORS.inkSoft, marginTop: "4px" }}>دستیار هوشمند کلاس شما</p>
          </div>
          <nav style={{padding:"8px 0"}}>
            <TabButton active={activeTab==="dashboard"} onClick={()=>setActiveTab("dashboard")} icon="📊" label="داشبورد" />
            <TabButton active={activeTab==="groups"} onClick={()=>setActiveTab("groups")} icon="👥" label="گروه‌های کلاس" />
            <TabButton active={activeTab==="assignments"} onClick={()=>setActiveTab("assignments")} icon="📝" label="تکالیف و آزمون" />
            <TabButton active={activeTab==="reports"} onClick={()=>setActiveTab("reports")} icon="📈" label="گزارش‌ها" />
            <TabButton active={activeTab==="special"} onClick={()=>setActiveTab("special")} icon="✨" label="امکانات ویژه" />
            <TabButton active={activeTab==="settings"} onClick={()=>setActiveTab("settings")} icon="⚙️" label="تنظیمات" />
          </nav>
        </div>

        <div style={{flex:1, padding:"28px", maxWidth:"900px"}}>
          {activeTab === "dashboard" && (
            <div>
              <SectionTitle sub="نگاهی سریع به وضعیت امروز کلاس‌های شما">داشبورد</SectionTitle>
              <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"16px", marginBottom:"24px"}}>
                <Panel style={{ borderTop: `3px solid ${COLORS.saffron}` }}>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>پیام‌های امروز</p>
                  <p style={{ fontSize: "28px", fontWeight: 700, color: COLORS.ink }}>۵</p>
                </Panel>
                <Panel style={{ borderTop: `3px solid ${COLORS.sage}` }}>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>تکالیف در انتظار تصحیح</p>
                  <p style={{ fontSize: "28px", fontWeight: 700, color: COLORS.ink }}>۱۲</p>
                </Panel>
                <Panel style={{ borderTop: `3px solid ${COLORS.brick}` }}>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>هشدارهای فعال</p>
                  <p style={{ fontSize: "28px", fontWeight: 700, color: COLORS.ink }}>{alerts.length}</p>
                </Panel>
              </div>
              <Panel>
                <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px"}}>
                  <span>🔔</span>
                  <span style={{ fontWeight: 700, color: COLORS.ink }}>هشدارهای زودهنگام</span>
                </div>
                {alerts.map(a => (
                  <div key={a.id} style={{ padding: "10px 0", borderTop: `1px solid ${COLORS.line}` }}>
                    <p style={{ fontWeight: 600, color: COLORS.ink, fontSize: "14px", margin:0 }}>{a.student} — {a.group}</p>
                    <p style={{ color: COLORS.inkSoft, fontSize: "13px", margin:"4px 0 0" }}>{a.note}</p>
                  </div>
                ))}
              </Panel>
            </div>
          )}

          {activeTab === "groups" && (
            <div>
              <SectionTitle sub="پیام‌های گروه را ببینید و با یک کلیک پاسخ پیشنهادی بگیرید">گروه‌های کلاس</SectionTitle>
              <div style={{display:"flex", gap:"8px", marginBottom:"16px"}}>
                {groups.map(g => (
                  <button key={g.id} onClick={()=>setSelectedGroupId(g.id)}
                    style={{ padding:"8px 16px", fontSize:"14px", background: g.id===selectedGroupId?COLORS.ink:"#fff",
                      color: g.id===selectedGroupId?"#fff":COLORS.ink, border:`1px solid ${COLORS.line}`, fontWeight:600, cursor:"pointer" }}>
                    {g.name} <span style={{opacity:0.7}}>· {g.members} نفر</span>
                  </button>
                ))}
              </div>
              <div style={{display:"flex", flexDirection:"column", gap:"12px"}}>
                {selectedGroup.messages.map(m => (
                  <Panel key={m.id}>
                    <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"8px"}}>
                      <span style={{ fontWeight: 600, color: COLORS.ink, fontSize: "14px" }}>
                        {m.sender} <span style={{ fontWeight: 400, color: COLORS.inkSoft, fontSize: "12px" }}>
                          ({m.role==="parent"?"والد":m.role==="student"?"دانش‌آموز":"شما"})</span>
                      </span>
                      <span style={{ color: COLORS.inkSoft, fontSize: "12px" }}>{m.time}</span>
                    </div>
                    <p style={{ color: COLORS.ink, fontSize: "14px", marginBottom: "12px" }}>{m.text}</p>
                    {m.role !== "teacher" && (
                      !replySuggestions[m.id] ? (
                        <AIButton loading={replyLoadingId===m.id} onClick={()=>handleSuggestReply(m)} />
                      ) : (
                        <div style={{ background: COLORS.paper, border: `1px dashed ${COLORS.saffron}`, padding: "12px" }}>
                          <p style={{ fontSize: "13px", color: COLORS.inkSoft, marginBottom: "6px" }}>پیشنهاد پاسخ:</p>
                          <p style={{ fontSize: "14px", color: COLORS.ink, marginBottom: "10px" }}>{replySuggestions[m.id]}</p>
                          <div style={{display:"flex", gap:"8px"}}>
                            <button onClick={()=>handleSendReply(m)}
                              style={{ display:"inline-flex", alignItems:"center", gap:"4px", padding:"6px 12px", fontSize:"14px", background: COLORS.sage, color: "#fff", fontWeight: 600, border:"none", cursor:"pointer" }}>
                              📤 ارسال در گروه
                            </button>
                            <button onClick={()=>handleSuggestReply(m)}
                              style={{ padding:"6px 12px", fontSize:"14px", border: `1px solid ${COLORS.line}`, color: COLORS.ink, background:"#fff", cursor:"pointer" }}>
                              پیشنهاد دیگر
                            </button>
                          </div>
                        </div>
                      )
                    )}
                  </Panel>
                ))}
              </div>
            </div>
          )}

          {activeTab === "assignments" && (
            <div>
              <SectionTitle sub="یادآوری‌ها را مدیریت کنید و با هوش مصنوعی آزمون بسازید">تکالیف و آزمون</SectionTitle>
              <Panel style={{marginBottom:"20px"}}>
                {assignments.map(a => (
                  <div key={a.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 0", borderTop:`1px solid ${COLORS.line}`}}>
                    <div>
                      <p style={{ fontWeight: 600, color: COLORS.ink, fontSize: "14px", margin:0 }}>{a.title}</p>
                      <p style={{ color: COLORS.inkSoft, fontSize: "12px", margin:"4px 0 0" }}>{a.group} · مهلت: {a.due}</p>
                    </div>
                    <button onClick={()=>setAssignments(prev=>prev.map(x=>x.id===a.id?{...x,remind:!x.remind}:x))}
                      style={{ display:"flex", alignItems:"center", gap:"4px", padding:"6px 12px", fontSize:"14px",
                        border: `1px solid ${a.remind?COLORS.sage:COLORS.line}`, color: a.remind?COLORS.sage:COLORS.inkSoft, fontWeight:600, background:"#fff", cursor:"pointer" }}>
                      {a.remind ? "✔️ یادآوری فعال" : "یادآوری غیرفعال"}
                    </button>
                  </div>
                ))}
              </Panel>
              <Panel>
                <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px"}}>
                  <span>✨</span><span style={{ fontWeight: 700, color: COLORS.ink }}>ساخت آزمون با هوش مصنوعی</span>
                </div>
                <div style={{display:"flex", gap:"12px", marginBottom:"12px"}}>
                  <input value={quizTopic} onChange={e=>setQuizTopic(e.target.value)} placeholder="موضوع درس"
                    style={{ flex:1, padding:"10px", border:`1px solid ${COLORS.line}`, background: COLORS.paper, fontFamily:"inherit" }} />
                  <input type="number" min={1} max={10} value={quizCount} onChange={e=>setQuizCount(e.target.value)}
                    style={{ width:"70px", padding:"10px", border:`1px solid ${COLORS.line}`, background: COLORS.paper, fontFamily:"inherit" }} />
                </div>
                <AIButton loading={quizLoading} onClick={handleGenerateQuiz} label="ساخت آزمون" />
                {quizResult && <pre style={{ whiteSpace:"pre-wrap", fontFamily:"'Vazirmatn', sans-serif", marginTop:"16px", background: COLORS.paper, padding:"14px", fontSize:"14px", color: COLORS.ink, border:`1px solid ${COLORS.line}` }}>{quizResult}</pre>}
              </Panel>
            </div>
          )}

          {activeTab === "reports" && (
            <div>
              <SectionTitle sub="خلاصه هفتگی همه گروه‌ها را با یک کلیک بسازید">گزارش‌ها</SectionTitle>
              <Panel>
                <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px"}}>
                  <span>📈</span><span style={{ fontWeight: 700, color: COLORS.ink }}>خلاصه هفتگی گروه‌ها</span>
                </div>
                <p style={{ color: COLORS.inkSoft, fontSize: "13px", marginBottom: "12px" }}>بر اساس پیام‌های واقعیِ گروه‌های نمایش‌داده‌شده در تب «گروه‌های کلاس» ساخته می‌شود.</p>
                <AIButton loading={reportLoading} onClick={handleGenerateReport} label="تولید خلاصه هفتگی" />
                {reportResult && <div style={{ marginTop:"16px", background: COLORS.paper, padding:"14px", fontSize:"14px", color: COLORS.ink, border:`1px solid ${COLORS.line}`, whiteSpace:"pre-wrap" }}>{reportResult}</div>}
              </Panel>
            </div>
          )}

          {activeTab === "special" && (
            <div>
              <SectionTitle sub="قابلیت‌هایی که این دستیار را از یک ربات ساده متمایز می‌کنند">امکانات ویژه</SectionTitle>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"16px", marginBottom:"20px"}}>
                <Panel>
                  <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px"}}><span>⚠️</span><span style={{ fontWeight: 700, color: COLORS.ink, fontSize: "14px" }}>هشدار زودهنگام افت تحصیلی</span></div>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>روند نمرات و مشارکت هر دانش‌آموز را دنبال می‌کند و پیش از افت جدی به شما خبر می‌دهد.</p>
                </Panel>
                <Panel>
                  <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px"}}><span>❤️</span><span style={{ fontWeight: 700, color: COLORS.ink, fontSize: "14px" }}>تحلیل فضای گروه</span></div>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>نشانه‌های استرس یا تنش در تعاملات گروه را تشخیص می‌دهد، بدون ورود به مکالمات خصوصی.</p>
                </Panel>
                <Panel>
                  <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px"}}><span>🛡️</span><span style={{ fontWeight: 700, color: COLORS.ink, fontSize: "14px" }}>تشخیص تکالیف تولیدشده با AI</span></div>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>به شما کمک می‌کند احتمال استفاده نامناسب دانش‌آموز از هوش مصنوعی در تکلیف را تشخیص دهید.</p>
                </Panel>
                <Panel>
                  <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px"}}><span>🏆</span><span style={{ fontWeight: 700, color: COLORS.ink, fontSize: "14px" }}>انگیزش و امتیازدهی</span></div>
                  <p style={{ color: COLORS.inkSoft, fontSize: "13px" }}>مشارکت و تحویل به‌موقع تکالیف را با نشان و امتیاز ملایم در گروه نمایش می‌دهد.</p>
                </Panel>
              </div>
              <Panel>
                <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px"}}><span>👶</span><span style={{ fontWeight: 700, color: COLORS.ink }}>حالت والدین — گزارش هفتگی خودکار</span></div>
                <div style={{display:"flex", flexDirection:"column", gap:"12px", marginBottom:"12px"}}>
                  <input value={parentStudent} onChange={e=>setParentStudent(e.target.value)} placeholder="نام دانش‌آموز"
                    style={{ padding:"10px", border:`1px solid ${COLORS.line}`, background: COLORS.paper, fontFamily:"inherit" }} />
                  <textarea value={parentNotes} onChange={e=>setParentNotes(e.target.value)} placeholder="یادداشت‌های شما" rows={2}
                    style={{ padding:"10px", border:`1px solid ${COLORS.line}`, background: COLORS.paper, fontFamily:"inherit" }} />
                </div>
                <AIButton loading={parentLoading} onClick={handleGenerateParentReport} label="ساخت گزارش برای والدین" />
                {parentResult && <div style={{ marginTop:"16px", background: COLORS.paper, padding:"14px", fontSize:"14px", color: COLORS.ink, border:`1px solid ${COLORS.line}`, whiteSpace:"pre-wrap" }}>{parentResult}</div>}
              </Panel>
            </div>
          )}

          {activeTab === "settings" && (
            <div>
              <SectionTitle sub="این بخش در نسخه دمو فقط نمایشی است">تنظیمات اتصال</SectionTitle>
              <Panel>
                {["تلگرام","بله","ایتا","واتساپ"].map(name => (
                  <div key={name} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 0", borderTop:`1px solid ${COLORS.line}`}}>
                    <span style={{ color: COLORS.ink, fontWeight: 600, fontSize: "14px" }}>{name}</span>
                    <span style={{ fontSize:"12px", color: name==="تلگرام"?COLORS.sage:COLORS.inkSoft, border:`1px solid ${name==="تلگرام"?COLORS.sage:COLORS.line}`, padding:"4px 10px" }}>
                      {name==="تلگرام" ? "متصل" : "اتصال نشده"}
                    </span>
                  </div>
                ))}
              </Panel>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TeacherAIApp />);
</script>
</body>
</html>
